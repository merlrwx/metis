name: metis

services:
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: metis
      POSTGRES_USER: metis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metis-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U metis -d metis]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: metis-backend:alpine
    build:
      context: ./src/backend
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://metis:${POSTGRES_PASSWORD:-metis-local-only}@database:5432/metis
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_BACKEND: local
      OBJECT_STORAGE_LOCAL_DIR: /data/metis-objects
      EMBEDDING_PROVIDER: hashing
    ports:
      - "8000:8000"
    volumes:
      - metis-objects:/data/metis-objects
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  worker:
    image: metis-backend:alpine
    build:
      context: ./src/backend
    command: [/app/.venv/bin/metis-worker]
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://metis:${POSTGRES_PASSWORD:-metis-local-only}@database:5432/metis
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_BACKEND: local
      OBJECT_STORAGE_LOCAL_DIR: /data/metis-objects
      EMBEDDING_PROVIDER: hashing
    volumes:
      - metis-objects:/data/metis-objects

  frontend:
    image: metis-frontend:alpine
    build:
      context: ./src/frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"

volumes:
  postgres-data:
  redis-data:
  metis-objects:
