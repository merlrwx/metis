apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: metis
spec:
  replicas: 1
  selector:
    matchLabels:
      component: backend
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
      labels:
        component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: metis-config
            - secretRef:
                name: metis-object-storage
                optional: true
            - secretRef:
                name: metis-connectors
                optional: true
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: metis-runtime
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: metis-runtime
                  key: REDIS_URL
                  optional: true
            - name: METIS_AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: metis-runtime
                  key: METIS_AUTH_SECRET_KEY
            - name: METIS_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: metis-runtime
                  key: METIS_BOOTSTRAP_TOKEN
            - name: GPTMOCK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: metis-runtime
                  key: GPTMOCK_API_KEY
                  optional: true
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: metis-runtime
                  key: EMBEDDING_API_KEY
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
