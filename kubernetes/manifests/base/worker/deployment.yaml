apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: metis
spec:
  replicas: 1
  selector:
    matchLabels:
      component: worker
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
      labels:
        component: worker
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: backend:latest
          imagePullPolicy: IfNotPresent
          command: [/app/.venv/bin/metis-worker]
          envFrom:
            - configMapRef:
                name: metis-config
            - secretRef:
                name: metis-object-storage
                optional: true
          ports:
            - name: metrics
              containerPort: 9100
          env:
            - name: METIS_WORKER_METRICS_PORT
              value: "9100"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: metis-runtime
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: metis-runtime
                  key: REDIS_URL
                  optional: true
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: metis-runtime
                  key: EMBEDDING_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
