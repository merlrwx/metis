apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-sources
  namespace: metis
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: backend:latest
              command: [/app/.venv/bin/metis-sync-sources]
              envFrom:
                - configMapRef:
                    name: metis-config
                - secretRef:
                    name: metis-connectors
                    optional: true
                - secretRef:
                    name: metis-object-storage
                    optional: true
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: metis-runtime
                      key: DATABASE_URL
                - name: REDIS_URL
                  valueFrom:
                    secretKeyRef:
                      name: metis-runtime
                      key: REDIS_URL
                      optional: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
