apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/backend

patches:
  - target:
      kind: Deployment
      name: backend
      namespace: metis
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: metis-database
                key: DATABASE_URL
          - name: REDIS_URL
            value: redis://dev-redis:6379/0
