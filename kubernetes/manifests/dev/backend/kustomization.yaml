apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/backend

patches:
  - target:
      kind: Deployment
      name: backend
      namespace: metis
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: metis-database
                key: DATABASE_URL
          - name: METIS_AUTH_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: metis-database
                key: METIS_AUTH_SECRET_KEY
          - name: METIS_BOOTSTRAP_TOKEN
            valueFrom:
              secretKeyRef:
                name: metis-database
                key: METIS_BOOTSTRAP_TOKEN
          - name: REDIS_URL
            value: redis://dev-redis:6379/0
          - name: OBJECT_STORAGE_BACKEND
            value: local
          - name: OBJECT_STORAGE_LOCAL_DIR
            value: /data/metis-objects
          - name: EMBEDDING_PROVIDER
            value: hashing
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: prepare-object-storage
            image: busybox:1.37
            command: [sh, -c, "mkdir -p /data/metis-objects && chown 1000:1000 /data/metis-objects"]
            securityContext:
              runAsUser: 0
            volumeMounts:
              - name: metis-objects
                mountPath: /data/metis-objects
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: metis-objects
            mountPath: /data/metis-objects
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: metis-objects
            hostPath:
              path: /var/lib/metis/objects
              type: DirectoryOrCreate
