apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/worker

patches:
  - target:
      kind: Deployment
      name: worker
      namespace: metis
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: prepare-object-storage
            image: busybox:1.37
            command: [sh, -c, "mkdir -p /data/metis-objects && chown 1000:1000 /data/metis-objects"]
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
            volumeMounts:
              - name: metis-objects
                mountPath: /data/metis-objects
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: metis-objects
            mountPath: /data/metis-objects
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: metis-objects
            hostPath:
              path: /var/lib/metis/objects
              type: DirectoryOrCreate
