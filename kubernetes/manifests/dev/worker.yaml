apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: metis
spec:
  replicas: 1
  selector:
    matchLabels:
      component: worker
  template:
    metadata:
      labels:
        component: worker
    spec:
      containers:
        - name: worker
          image: backend:latest
          command: [/app/.venv/bin/metis-worker]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: metis-database
                  key: DATABASE_URL
            - name: REDIS_URL
              value: redis://dev-redis:6379/0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
