apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: metis
spec:
  replicas: 1
  selector:
    matchLabels:
      component: worker
  template:
    metadata:
      labels:
        component: worker
    spec:
      containers:
        - name: worker
          image: backend:latest
          command: [/app/.venv/bin/metis-worker]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: metis-database
                  key: DATABASE_URL
            - name: REDIS_URL
              value: redis://dev-redis:6379/0
            - name: OBJECT_STORAGE_BACKEND
              value: local
            - name: OBJECT_STORAGE_LOCAL_DIR
              value: /data/metis-objects
          volumeMounts:
            - name: metis-objects
              mountPath: /data/metis-objects
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      initContainers:
        - name: prepare-object-storage
          image: busybox:1.37
          command: [sh, -c, "mkdir -p /data/metis-objects && chown 1000:1000 /data/metis-objects"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: metis-objects
              mountPath: /data/metis-objects
      volumes:
        - name: metis-objects
          hostPath:
            path: /var/lib/metis/objects
            type: DirectoryOrCreate
