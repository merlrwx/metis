apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - database-secret.yaml
  - backend
  - worker.yaml
  - frontend

namespace: metis
namePrefix: dev-

images:
  - name: backend
    newTag: dev
  - name: frontend
    newTag: dev
