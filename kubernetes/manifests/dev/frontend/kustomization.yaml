apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/frontend

# Patch for the frontend deployment
patches:
  - target:
      kind: Deployment
      name: frontend
      namespace: metis
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: BACKEND_URL
            value: "http://dev-backend:22112"
  - target:
      kind: Service
      name: frontend
      namespace: metis
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
