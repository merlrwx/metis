apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: metis
spec:
  selector:
    component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: metis
spec:
  replicas: 1
  selector:
    matchLabels:
      component: postgres
  template:
    metadata:
      labels:
        component: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: metis
            - name: POSTGRES_USER
              value: metis
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: metis-runtime
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: [pg_isready, -U, metis, -d, metis]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, metis, -d, metis]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: database-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: database-data
          emptyDir: {}
