<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "historyCacheSize": 0, "selfRequestsOnly": true, "attributesToSettle": ["class", "width", "height"]}'>
  <title>{% block title %}Metis{% endblock %} · Metis</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v={{ ASSET_VERSION }}">
  <script src="/static/htmx-2.0.4.min.js" defer></script>
  <script src="/static/app.js?v={{ ASSET_VERSION }}" defer></script>
</head>
<body hx-boost="true" hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
  <a class="skip-link" href="#content">Skip to content</a>
  {% block body %}{% endblock %}
</body>
</html>
