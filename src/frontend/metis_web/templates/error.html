{% extends "app_shell.html" if signed_in and user else "auth_shell.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card">
  <h2>{{ title }}</h2>
  <p class="muted">{{ message }}</p>
  <div class="row">
    <a class="btn btn-primary" href="/">Go to Metis</a>
    {% if not signed_in %}<a class="btn" href="/login">Sign in</a>{% endif %}
  </div>
</div>
{% endblock %}
