[project]
name = "metis-backend"
version = "0.1.0"
description = "FastAPI backend for Metis organisation knowledge."
readme = "README.md"
authors = [{ name = "Jason Standen", email = "jason@merl.one" }]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "boto3>=1.38",
    "fastapi>=0.141.1",
    "langchain-openai>=1.6.7",
    "pgvector>=0.4.2",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "pypdf>=5.4",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "uvicorn>=0.53.0",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.8,<0.9"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = ["external_worker: starts a separate background worker process"]

[project.scripts]
metis-embeddings = "backend.semantic_runtime:main"
metis-download-embeddings = "backend.semantic_runtime:download"
metis-reindex = "backend.reindex:main"
metis-check-embeddings = "backend.embeddings:main"
metis-api = "backend.main:main"
metis-worker = "backend.worker:main"
metis-reconcile = "backend.reconcile:main"
metis-sync-sources = "backend.sync_sources:main"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
