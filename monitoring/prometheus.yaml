# Compose network targets. Mount this into your existing Prometheus instance.
# In Kubernetes, use pod discovery for the annotated API and worker pods.
global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/metis-alerts.yaml
scrape_configs:
  - job_name: metis-api
    static_configs:
      - targets: [backend:8000]
  - job_name: metis-worker
    static_configs:
      - targets: [worker:9100]
