services:
  embeddings:
    build:
      context: ./src/backend
      dockerfile: Dockerfile.embeddings
    image: metis-embeddings:local
    environment:
      METIS_MODEL_DIR: /models
      METIS_EMBEDDING_HOST: 0.0.0.0
    volumes:
      - semantic-model:/models
    ports:
      - "127.0.0.1:8003:8003"
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
  backend:
    environment:
      EMBEDDING_PROVIDER: openai-compatible
      METIS_EMBEDDING_PREFLIGHT: "true"
    depends_on:
      embeddings:
        condition: service_healthy
  worker:
    environment:
      EMBEDDING_PROVIDER: openai-compatible
    depends_on:
      embeddings:
        condition: service_healthy
volumes:
  semantic-model:
