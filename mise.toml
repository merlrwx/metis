# mise use python@3.13

[tools]
flux2 = "latest"
gh = "latest"
k3d = "latest"
k9s = "latest"
kubectl = "latest"
pre-commit = "latest"
python = "3.13"
ruff = "0.16.9"
trivy = "latest"
uv = "latest"

[settings]
python.uv_venv_auto = "create|source"
idiomatic_version_file_enable_tools = ["python"]
experimental = true

[env]
APP_REPO = 'metis'
GITOPS_REPO = 'metis-gitops'
GITUSER = 'merlrwx'

[hooks]
enter = "bash ./scripts/setup_project"

[tasks.k8s-setup-local]
description = "Set up a basic Kubernetes cluster for development that builds the local images and applies them"
run = "bash ./kubernetes/setup_cluster_local"

[tasks.k8s-setup-minimal]
description = "Set up a minimal local Kubernetes cluster without deploying workloads"
run = "bash ./kubernetes/setup_cluster_minimal"

[tasks.e2e-test]
description = "Run end-to-end tests for the Metis application in a local k3d cluster"
run = "uv run --locked --project ./kubernetes python ./kubernetes/e2e_test.py"

[tasks.test-gptmock]
description = "Send an optional live test message to the configured GPTMock bridge"
run = "bash ./scripts/test-gptmock"

[tasks.setup-keys]
description = "Set up deploy key for repo"
run = "bash ./scripts/setup_deploy_key"

[tasks.setup-gitops]
description = "Bootstrap Flux from the configured GitOps repository"
run = "bash ./scripts/setup_gitops"

[tasks.setup-cluster-gitops]
description = "Create a local k3d cluster and bootstrap Flux"
run = "bash ./scripts/setup_cluster_gitops"

[tasks.evaluate-llm]
description = "Opt-in live evaluation using synthetic grounded-answer fixtures"
run = "uv run --locked --project src/backend python scripts/evaluate_llm.py"
